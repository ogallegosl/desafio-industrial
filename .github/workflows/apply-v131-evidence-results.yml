name: Apply v1.3.1 evidence-results improvement

on:
  push:
    branches:
      - feature/v1.3.1-evidencias-resultados
    paths:
      - '.github/workflows/apply-v131-evidence-results.yml'
      - 'scripts/apply-v131-evidence-results.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v1.3.1-evidencias-resultados
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Apply v1.3.1 patch
        run: python3 scripts/apply-v131-evidence-results.py

      - name: Keep v1.3 importer audit compatible with patch releases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/exam-package-import-audit.mjs')
          text = p.read_text(encoding='utf-8')
          old = "check('Versión', 'Versión 1.3.0 declarada', pkg.version === '1.3.0', 'high', pkg.version)"
          new = "check('Versión', 'Versión compatible con importador v1.3.x', /^1\\.3\\.\\d+$/.test(pkg.version), 'high', pkg.version)"
          if text.count(old) != 1:
              raise SystemExit('No se encontró la comprobación de versión esperada del audit v1.3.0')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Core audits
        run: |
          npm run audit:security
          npm run audit:strict
          npm run audit:teacher
          npm run audit:v130

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: v1.3.1 evidencias auditables y resultados por pregunta"
          git push origin HEAD:feature/v1.3.1-evidencias-resultados
